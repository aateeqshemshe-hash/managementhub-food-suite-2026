      /* =========================================================================
         CUSTOMER STOREFRONT MENU CARD: DYNAMIC SHAPE & SIZE ENGINE
         Admin Customizable: Shape (Round, Squircle, Sharp, Pill, Angled), 
         Image Frame (Square, Landscape, Classic, Circle, Capsule), and Size
         ========================================================================= */
      :root {
        --menu-card-radius: 18px;
        --menu-card-img-radius: 18px 18px 0 0;
        --menu-card-img-aspect: 1 / 1;
        --menu-card-img-fit: contain;
        --menu-card-img-height: auto;
        --menu-card-min-width: 260px;
        --menu-card-gap: 16px;
        --menu-card-border: 1px solid rgba(255, 255, 255, 0.08);
        --menu-card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      /* Base Dish Card Frame */
      .group:has(> .relative.h-48),
      .group:has(> .relative.h-36),
      div[class*="rounded-3xl"]:has(> .relative.h-48),
      div[class*="rounded-3xl"]:has(> .relative.h-36) {
        border-radius: var(--menu-card-radius, 18px) !important;
        border: var(--menu-card-border, 1px solid rgba(255, 255, 255, 0.08)) !important;
        box-shadow: var(--menu-card-shadow, 0 4px 20px rgba(0, 0, 0, 0.4)) !important;
        overflow: hidden !important;
        transition: transform 0.2s ease, box-shadow 0.2s ease !important;
      }

      /* Card Shapes: Sharp Sleek Box */
      html[data-card-shape="sharp"] .group:has(> .relative.h-48),
      html[data-card-shape="sharp"] .group:has(> .relative.h-36),
      html[data-card-shape="sharp"] div[class*="rounded-3xl"]:has(> .relative.h-48),
      html[data-card-shape="sharp"] div[class*="rounded-3xl"]:has(> .relative.h-36),
      html[data-card-shape="sharp"] .product-image {
        border-radius: 0px !important;
      }

      /* Card Shapes: Squircle Super Smooth (26px) */
      html[data-card-shape="rounded-3xl"] .group:has(> .relative.h-48),
      html[data-card-shape="rounded-3xl"] .group:has(> .relative.h-36),
      html[data-card-shape="rounded-3xl"] div[class*="rounded-3xl"]:has(> .relative.h-48),
      html[data-card-shape="rounded-3xl"] div[class*="rounded-3xl"]:has(> .relative.h-36) {
        border-radius: 26px !important;
      }

      /* Card Shapes: Organic Capsule / Pill Curve (36px) */
      html[data-card-shape="pill"] .group:has(> .relative.h-48),
      html[data-card-shape="pill"] .group:has(> .relative.h-36),
      html[data-card-shape="pill"] div[class*="rounded-3xl"]:has(> .relative.h-48),
      html[data-card-shape="pill"] div[class*="rounded-3xl"]:has(> .relative.h-36) {
        border-radius: 36px !important;
      }

      /* Card Shapes: Angled Cyber Cut (Diagonal) */
      html[data-card-shape="angled"] .group:has(> .relative.h-48),
      html[data-card-shape="angled"] .group:has(> .relative.h-36),
      html[data-card-shape="angled"] div[class*="rounded-3xl"]:has(> .relative.h-48),
      html[data-card-shape="angled"] div[class*="rounded-3xl"]:has(> .relative.h-36) {
        border-radius: 28px 4px 28px 4px !important;
      }

      /* Product Image Container Specification & Auto-Fit */
      .product-image,
      .group > .relative.h-48,
      .group > .relative.h-36,
      .group .relative.h-48,
      .group .relative.h-36,
      div[class*="rounded-3xl"] > .relative.h-48,
      div[class*="rounded-3xl"] > .relative.h-36,
      .relative.h-48:has(> img),
      .relative.h-36:has(> img),
      [data-dish-image-container] {
        width: 100% !important;
        aspect-ratio: var(--menu-card-img-aspect, 1 / 1) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        overflow: hidden !important;
        position: relative !important;
        border-radius: var(--menu-card-img-radius, 18px 18px 0 0) !important;
        background-color: #020617 !important;
        height: var(--menu-card-img-height, auto) !important;
        max-height: none !important;
      }

      .product-image img,
      .group > .relative.h-48 img,
      .group > .relative.h-36 img,
      .group .relative.h-48 img,
      .group .relative.h-36 img,
      div[class*="rounded-3xl"] > .relative.h-48 img,
      div[class*="rounded-3xl"] > .relative.h-36 img,
      .relative.h-48:has(> img) img,
      .relative.h-36:has(> img) img,
      [data-dish-image-container] img,
      .storefront-dish-img {
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: var(--menu-card-img-aspect, 1 / 1) !important;
        object-fit: var(--menu-card-img-fit, contain) !important;
        object-position: center center !important;
        background-color: transparent !important;
        display: block !important;
        border-radius: inherit !important;
        transition: transform 0.3s ease !important;
      }

      /* Image Shapes: Round Floating Circle Avatar */
      html[data-img-shape="circle"] .product-image,
      html[data-img-shape="circle"] .group > .relative.h-48,
      html[data-img-shape="circle"] .group > .relative.h-36,
      html[data-img-shape="circle"] div[class*="rounded-3xl"] > .relative.h-48,
      html[data-img-shape="circle"] div[class*="rounded-3xl"] > .relative.h-36 {
        width: 130px !important;
        height: 130px !important;
        min-width: 130px !important;
        max-width: 130px !important;
        border-radius: 9999px !important;
        margin: 12px auto 4px !important;
        border: 3px solid rgba(249, 115, 22, 0.4) !important;
      }
      html[data-img-shape="circle"] .product-image img,
      html[data-img-shape="circle"] .group > .relative.h-48 img,
      html[data-img-shape="circle"] .group > .relative.h-36 img {
        border-radius: 9999px !important;
        object-fit: cover !important;
      }

      /* Image Shapes: Capsule / Oval Frame */
      html[data-img-shape="capsule"] .product-image,
      html[data-img-shape="capsule"] .group > .relative.h-48,
      html[data-img-shape="capsule"] .group > .relative.h-36 {
        border-radius: 9999px !important;
        margin: 8px 12px !important;
        width: calc(100% - 24px) !important;
      }

      .group:hover .product-image img,
      .group:hover > .relative.h-48 img,
      .group:hover > .relative.h-36 img,
      .group:hover [data-dish-image-container] img {
        transform: scale(1.03) !important;
      }

      /* Clean Dish Image: No price overlay on photo */
      .product-image .absolute,
      .product-image [class*="bottom-"],
      .product-image span[class*="font-black"],
      .group .relative .absolute[class*="bottom-"],
      .group .relative span.absolute,
      .group > .relative.h-48 .absolute.bottom-3,
      .group > .relative.h-36 .absolute.bottom-3,
      .group .relative.h-48 .absolute.bottom-3,
      .group .relative.h-36 .absolute.bottom-3,
      div[class*="rounded-3xl"] > .relative.h-48 .absolute.bottom-3,
      div[class*="rounded-3xl"] > .relative.h-36 .absolute.bottom-3,
      .relative.h-48:has(> img) .absolute.bottom-3,
      .relative.h-36:has(> img) .absolute.bottom-3,
      [data-dish-image-container] .absolute.bottom-3,
      .relative:has(> img) > span.absolute,
      div[class*="overflow-hidden"]:has(> img) > span.absolute,
      span.absolute.bottom-2,
      span.absolute.bottom-2.left-2,
      span.absolute[class*="bottom-2"],
      span.absolute[class*="bottom-3"],
      .product-image span[class*="font-black"],
      .group > .relative.h-48 span[class*="font-black"],
      .group > .relative.h-36 span[class*="font-black"],
      [data-dish-image-container] span[class*="font-black"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* Grid Proportions: Admin Scalable */
      .grid:has(> .group .relative.h-48),
      .grid:has(> .group .relative.h-36),
      .grid:has(> div[class*="rounded-3xl"] .relative.h-48),
      .grid:has(> div[class*="rounded-3xl"] .relative.h-36),
      .storefront-dish-grid {
        grid-template-columns: repeat(auto-fill, minmax(var(--menu-card-min-width, 260px), 1fr)) !important;
        gap: var(--menu-card-gap, 16px) !important;
      }

      /* Foodpanda Horizontal Card Mode (Desktop or Mobile when selected) */
      html[data-menu-layout="horizontal"] .grid:has(> .group:has(> .relative.h-48)),
      html[data-menu-layout="horizontal"] .grid:has(> .group:has(> .relative.h-36)),
      html[data-menu-layout="horizontal"] .grid:has(> div[class*="rounded-3xl"]:has(> .relative.h-48)),
      html[data-menu-layout="horizontal"] .grid:has(> div[class*="rounded-3xl"]:has(> .relative.h-36)),
      html[data-menu-layout="horizontal"] .storefront-dish-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: var(--menu-card-gap, 12px) !important;
      }
      html[data-menu-layout="horizontal"] .group:has(> .relative.h-48),
      html[data-menu-layout="horizontal"] .group:has(> .relative.h-36),
      html[data-menu-layout="horizontal"] div[class*="rounded-3xl"]:has(> .relative.h-48),
      html[data-menu-layout="horizontal"] div[class*="rounded-3xl"]:has(> .relative.h-36) {
        display: flex !important;
        flex-direction: row !important;
        align-items: stretch !important;
        min-height: 105px !important;
        padding: 10px 12px !important;
        gap: 12px !important;
      }
      html[data-menu-layout="horizontal"] .product-image,
      html[data-menu-layout="horizontal"] .group > .relative.h-48,
      html[data-menu-layout="horizontal"] .group > .relative.h-36,
      html[data-menu-layout="horizontal"] div[class*="rounded-3xl"] > .relative.h-48,
      html[data-menu-layout="horizontal"] div[class*="rounded-3xl"] > .relative.h-36 {
        order: 2 !important;
        width: 110px !important;
        min-width: 110px !important;
        max-width: 110px !important;
        height: 110px !important;
        border-radius: var(--menu-card-radius, 14px) !important;
        flex-shrink: 0 !important;
      }

      /* Compact Mini Tile Mode */
      html[data-card-size="compact"] .grid:has(> .group .relative.h-48) {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important;
        gap: 10px !important;
      }

      /* Jumbo Showcase Mode */
      html[data-card-size="large"] .grid:has(> .group .relative.h-48) {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important;
        gap: 22px !important;
      }

      /* Foodpanda Mobile Card Layout */
      @media (max-width: 768px) {
        /* Left Side: Dish Details (Name, Description, Portion Rates, Add Button) */
        .group:has(> .relative.h-48) > div:nth-child(2),
        .group:has(> .relative.h-36) > div:nth-child(2),
        div[class*="rounded-3xl"]:has(> .relative.h-48) > div:nth-child(2),
        div[class*="rounded-3xl"]:has(> .relative.h-36) > div:nth-child(2),
        .group:has(> .relative.h-48) > .p-5,
        .group:has(> .relative.h-36) > .p-5 {
          order: 1 !important;
          flex: 1 1 0% !important;
          min-width: 0 !important;
          padding: 0 !important;
          display: flex !important;
          flex-direction: column !important;

        function getCleanStoreSlug(rest) {
          if (!rest) return 'restaurant';
          return (rest.slug || rest.id || 'restaurant').toLowerCase().replace(/[^a-z0-9_-]/gi, '').replace(/-+$/, '');
        }

        // Returns clean, authentic non-AI production domain URL (e.g. https://apna-restaurant.orderhub.pk)
        function formatDirectStoreUrl(rest) {
          if (!rest) return 'https://orderhub.pk';
          if (rest.customDomain && rest.customDomain.trim()) {
            const cleanDomain = rest.customDomain.trim().replace(/^https?:\/\//i, '').replace(/\/+$/, '');
            return 'https://' + cleanDomain;
          }
          const cleanSlug = getCleanStoreSlug(rest);
          return 'https://' + cleanSlug + '.orderhub.pk';
        }

        // Internal local runtime URL for previewing inside current browser session
        function getLocalStoreUrl(rest) {
          if (!rest) return window.location.origin;
          const cleanSlug = getCleanStoreSlug(rest);
          return window.location.origin + '/?store=' + encodeURIComponent(cleanSlug);
        }

        // Global Clipboard Interceptor: Ensure no "ais-dev" or "run.app" is ever copied to clipboard
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
          const originalWriteText = navigator.clipboard.writeText.bind(navigator.clipboard);
          navigator.clipboard.writeText = function(text) {
            if (typeof text === 'string' && (text.includes('run.app') || text.includes('ais-') || text.includes('asia-east1'))) {
              try {
                const restsRaw = localStorage.getItem('bitehub_pkr_restaurants_v2');
                let rests = [];
                if (restsRaw) rests = JSON.parse(restsRaw) || [];
                for (const r of rests) {
                  const s = (r.slug || '').toLowerCase();
                  const id = (r.id || '').toLowerCase();
                  if ((s && text.toLowerCase().includes(s)) || (id && text.toLowerCase().includes(id))) {
                    text = formatDirectStoreUrl(r);
                    return originalWriteText(text);
                  }
                }
                text = text.replace(/https?:\/\/[a-z0-9\-_.]+\.run\.app[^\s"']*/gi, 'https://orderhub.pk');
              } catch (e) {}
            }
            return originalWriteText(text);
          };
        }

            let rests = [];
            if (restsRaw) {
              try { rests = JSON.parse(restsRaw) || []; } catch {}
            }
            elements.forEach(function(el) {
              const text = el.textContent || '';
              if (text.includes('run.app') || text.includes('ais-pre') || text.includes('ais-dev') || text.includes('asia-east1')) {
                let replaced = false;
                for (const r of rests) {
                  const s = (r.slug || '').toLowerCase();
                  const id = (r.id || '').toLowerCase();
                  if ((s && text.toLowerCase().includes(s)) || (id && text.toLowerCase().includes(id))) {
                    el.textContent = formatDirectStoreUrl(r);
                    if (el.title) el.title = formatDirectStoreUrl(r);
                    replaced = true;
                    break;
                  }
                }
                if (!replaced) {
                  if (rests.length > 0) {
                    el.textContent = formatDirectStoreUrl(rests[0]);
                    if (el.title) el.title = formatDirectStoreUrl(rests[0]);
                  } else {

              }

        }

          document.body.appendChild(modal);

          // Wire Modal Events
          document.getElementById('close-theme-modal').onclick = () => modal.remove();

          const slipFromThemeBtn = document.getElementById('open-slip-from-theme-btn');

            slipFromThemeBtn.onclick = () => {
              modal.remove();

          // Preset click listener
          modal.querySelectorAll('.theme-preset-option').forEach(el => {

              document.getElementById('theme-primary-hex').value = p;
              modal.querySelectorAll('.theme-preset-option').forEach(o => o.style.borderColor = '#334155');

          // Sync color picker with hex
          const colorInput = document.getElementById('theme-primary-color');
          const hexInput = document.getElementById('theme-primary-hex');
          colorInput.oninput = () => { hexInput.value = colorInput.value; };
          hexInput.oninput = () => { colorInput.value = hexInput.value; };

          // Helper: format string to clean web URL slug
          function makeSlug(str) {
            return (str || '')
              .toString()
              .toLowerCase()
              .trim()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/[^a-z0-9\s-]/g, '')
              .replace(/[\s_]+/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-+|-+$/g, '');
          }

          const autoInput = document.getElementById('auto-slug-input');
          const autoPreview = document.getElementById('auto-slug-preview');
          const directInput = document.getElementById('direct-storefront-url');

          if (autoInput) {
            autoInput.oninput = function() {
              const slug = makeSlug(this.value) || 'restaurant';
              if (autoPreview) autoPreview.textContent = slug;
              restaurant.slug = slug;
              const newDirect = formatDirectStoreUrl(restaurant);
              if (directInput) directInput.value = newDirect;
            };
          }

          const setSlugBtn = document.getElementById('auto-slug-generate-btn');
          if (setSlugBtn) {
            setSlugBtn.onclick = function() {
              const slug = makeSlug(autoInput.value) || 'restaurant';
              restaurant.slug = slug;
              const newDirect = formatDirectStoreUrl(restaurant);
              if (directInput) directInput.value = newDirect;
              if (autoPreview) autoPreview.textContent = slug;
              localStorage.setItem('bitehub_pkr_restaurants_v2', JSON.stringify(rests));
              fetch('/api/sync/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

          };

          // Launch Storefront
          document.getElementById('launch-direct-store-btn').onclick = () => {
            const currentUrl = directInput ? directInput.value : directUrl;
            window.open(currentUrl, '_blank');

          // Open Custom Domain
          document.getElementById('open-custom-domain-btn').onclick = () => {

            if (!d.startsWith('http://') && !d.startsWith('https://')) d = 'https://' + d;
            window.open(d, '_blank');
            alert('🌐 Opening ' + d + ' in browser...\n\n💡 Note: Agar browser mein "Site can\'t be reached" aaye, toh iska matlab hai aapki domain ka DNS abhi is app par point nahi hua.\n\n"⚙️ DNS Guide" button dabayein aur 1 minute mein connect karein!');

          // Open DNS Setup Guide
          document.getElementById('guide-custom-domain-btn').onclick = () => {
            const currentDomain = document.getElementById('custom-domain-input').value.trim() || restaurant.customDomain || 'apna-restaurant.com';

          // Save Theme to API
          document.getElementById('save-theme-btn').onclick = async () => {
            const pColor = hexInput.value.trim() || '#f97316';

            const ann = document.getElementById('theme-announcement').value.trim();
            const cDomain = document.getElementById('custom-domain-input').value.trim();

            const saveBtn = document.getElementById('save-theme-btn');
            saveBtn.textContent = '⏳ Saving...';

            try {

              await fetch(`/api/restaurants/${restaurant.id}/theme`, {

                  layoutStyle: layout,
                  announcementText: ann
                })

              // Update custom domain
              if (cDomain !== (restaurant.customDomain || '')) {
                await fetch(`/api/restaurants/${restaurant.id}/domain`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    id: restaurant.id,
                    customDomain: cDomain
                  })
                });

              // Update local state directly
              const autoInputVal = document.getElementById('auto-slug-input') ? document.getElementById('auto-slug-input').value : '';
              if (autoInputVal) restaurant.slug = makeSlug(autoInputVal);
              const imgOrient = document.getElementById('theme-image-orientation') ? document.getElementById('theme-image-orientation').value : 'horizontal';

              restaurant.imageOrientation = imgOrient;
              restaurant.primaryColor = pColor;
              restaurant.layoutStyle = layout;
              restaurant.announcementText = ann;
              restaurant.customDomain = cDomain;
              const nowIso = new Date().toISOString();
              localStorage.setItem('bitehub_pkr_restaurants_v2', JSON.stringify(rests));
              localStorage.setItem('bitehub_last_user_edit_ts', nowIso);

              localStorage.setItem('bitehub_dish_image_mode_' + restaurant.id, imgOrient);

              await backupToVault();

              // Sync full restaurant update to server

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ updates: { restaurants: rests } })
              }).catch(() => {});

              alert('✅ Restaurant Theme & Settings Successfully Saved!');
              modal.remove();
              window.location.reload();
            } catch (err) {
              alert('Error saving theme: ' + err.message);
              if (saveBtn) {
                saveBtn.textContent = '💾 Save Restaurant Theme';
                saveBtn.disabled = false;
              }

        // Full customization access for Admin & Super Admin: Shape, Size, Image Aspect, Corners & Layout
        // =========================================================================
        window.applyMenuCardConfig = function(targetRestaurant) {
          try {
            if (!targetRestaurant) {
              const restsRaw = localStorage.getItem('bitehub_pkr_restaurants_v2');
              let rests = [];
              try { rests = JSON.parse(restsRaw) || []; } catch {}
              const params = new URLSearchParams(window.location.search);
              const storeSlug = params.get('store');
              if (storeSlug) {
                targetRestaurant = rests.find(r => r.slug === storeSlug || r.id === storeSlug);
              }
              if (!targetRestaurant) targetRestaurant = rests[0];
            }
            if (!targetRestaurant) return;

            const cfg = targetRestaurant.menuCardConfig || {};
            const shape = cfg.shape || 'rounded-2xl';
            const imgShape = cfg.imageShape || 'square';
            const layout = cfg.layout || targetRestaurant.layoutStyle || 'grid';
            const sizePreset = cfg.sizePreset || 'medium';

            let minWidth = cfg.cardWidth || (sizePreset === 'compact' ? 210 : sizePreset === 'large' ? 320 : 260);
            let imgHeight = cfg.imageHeight || (sizePreset === 'compact' ? 120 : sizePreset === 'large' ? 220 : 160);
            let radius = cfg.cardRadius !== undefined ? cfg.cardRadius : (shape === 'sharp' ? 0 : shape === 'pill' ? 36 : shape === 'rounded-3xl' ? 26 : shape === 'angled' ? 28 : 18);
            let gap = cfg.cardGap || (sizePreset === 'compact' ? 10 : sizePreset === 'large' ? 22 : 16);

            let aspect = '1 / 1';
            let imgFit = 'contain';
            if (imgShape === 'landscape') { aspect = '16 / 9'; imgFit = 'cover'; }
            else if (imgShape === 'classic') { aspect = '4 / 3'; imgFit = 'cover'; }
            else if (imgShape === 'circle') { aspect = '1 / 1'; imgFit = 'cover'; }
            else if (imgShape === 'capsule') { aspect = '2 / 1'; imgFit = 'cover'; }

            document.documentElement.setAttribute('data-card-shape', shape);
            document.documentElement.setAttribute('data-img-shape', imgShape);
            document.documentElement.setAttribute('data-menu-layout', layout);
            document.documentElement.setAttribute('data-card-size', sizePreset);

            document.documentElement.style.setProperty('--menu-card-radius', radius + 'px');
            document.documentElement.style.setProperty('--menu-card-img-radius', radius + 'px ' + radius + 'px 0 0');
            document.documentElement.style.setProperty('--menu-card-img-aspect', aspect);
            document.documentElement.style.setProperty('--menu-card-img-fit', imgFit);
            document.documentElement.style.setProperty('--menu-card-min-width', minWidth + 'px');
            document.documentElement.style.setProperty('--menu-card-gap', gap + 'px');
          } catch (e) {
            console.warn('[CardConfig] Apply error:', e);
          }
        };

    <script>
      // Safe toast notification replacement for window.alert to prevent iframe freeze
      window.alert = function(msg) {
        if (!msg) return;
        console.warn('[Notice]', msg);
        let toast = document.getElementById('global-safe-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'global-safe-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999999;background:#0f172a;border:1px solid #f97316;color:#f8fafc;padding:12px 22px;border-radius:12px;font-family:sans-serif;font-size:13px;font-weight:600;box-shadow:0 12px 35px rgba(0,0,0,0.6);display:flex;align-items:center;gap:10px;pointer-events:none;transition:all 0.25s ease;';
          document.body.appendChild(toast);
        }
        toast.innerHTML = '<span>🔔</span> <span>' + String(msg) + '</span>';
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function() {
          if (toast) {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(12px)';
          }
        }, 4000);
      };

          // If uploaded dish photo, retry with cache-buster before replacing
          if (target.src && target.src.includes('/uploads/dishes/') && !target.dataset.retried) {

              if (target) target.src = target.src.split('?')[0] + '?t=' + Date.now();
            }, 600);
            return;
          }
          target.dataset.fallbackApplied = 'true';
          target.src = 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=800&q=80';
